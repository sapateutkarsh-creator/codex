<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Calculator</title>
    <style>
      :root {
        --bg-start: #141414;
        --bg-end: #3b3b3b;
        --panel: rgba(24, 28, 34, 0.48);
        --panel-border: rgba(133, 245, 255, 0.28);
        --display-main: #75f7ff;
        --display-secondary: rgba(215, 253, 255, 0.68);
        --number-key: rgba(112, 121, 136, 0.55);
        --number-key-hover: rgba(131, 141, 157, 0.72);
        --operator-key: rgba(255, 153, 61, 0.88);
        --operator-key-hover: rgba(255, 171, 93, 0.98);
        --equals-key: rgba(34, 114, 58, 0.92);
        --equals-key-hover: rgba(45, 145, 75, 1);
        --danger: #ff8b8b;
        --text: #f4fbff;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg-start), #222, var(--bg-end));
        color: var(--text);
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        border-radius: 50%;
        filter: blur(75px);
        pointer-events: none;
      }

      body::before {
        width: 280px;
        height: 280px;
        background: rgba(36, 182, 194, 0.2);
        top: 8%;
        left: 10%;
      }

      body::after {
        width: 340px;
        height: 340px;
        background: rgba(255, 149, 0, 0.15);
        right: 8%;
        bottom: 6%;
      }

      .app-shell {
        position: relative;
        width: min(92vw, 420px);
        min-height: 710px;
      }

      .calculator-card,
      .login-overlay {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow), 0 0 24px rgba(117, 247, 255, 0.12);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
      }

      .calculator-card {
        padding: 28px;
        display: grid;
        gap: 24px;
        transform: scale(0.98);
        opacity: 0.12;
        transition: opacity 420ms ease, transform 420ms ease;
        pointer-events: none;
      }

      .calculator-card.is-unlocked {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .title-group h1 {
        margin: 0;
        font-size: 1.55rem;
        letter-spacing: 0.04em;
      }

      .title-group p,
      .auth-status {
        margin: 4px 0 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.92rem;
      }

      .display {
        min-height: 154px;
        padding: 22px;
        border-radius: 24px;
        background: rgba(7, 19, 24, 0.54);
        border: 1px solid rgba(117, 247, 255, 0.18);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: inset 0 0 24px rgba(4, 17, 21, 0.48);
      }

      .display-history {
        min-height: 24px;
        margin: 0 0 10px;
        color: var(--display-secondary);
        text-align: right;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        word-break: break-word;
      }

      .display-main {
        margin: 0;
        color: var(--display-main);
        text-align: right;
        font-size: clamp(2.4rem, 7vw, 3.65rem);
        line-height: 1.1;
        text-shadow: 0 0 18px rgba(117, 247, 255, 0.28);
        word-break: break-word;
      }

      /*
        CSS Grid note:
        The calculator keypad uses a fixed 4-column by 5-row grid.
        grid-template-columns creates four equal-width tracks while the DOM order
        places each button into the next available cell, making copy/paste friendly.
      */
      .keypad {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .key {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        min-height: 72px;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
        background: var(--number-key);
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .key:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.25);
      }

      .key:active {
        transform: scale(0.96);
      }

      .key.number:hover,
      .key.utility:hover {
        background: var(--number-key-hover);
      }

      .key.operator {
        background: var(--operator-key);
      }

      .key.operator:hover {
        background: var(--operator-key-hover);
      }

      .key.equals {
        background: var(--equals-key);
      }

      .key.equals:hover {
        background: var(--equals-key-hover);
      }

      .login-overlay {
        padding: 30px;
        display: grid;
        place-items: center;
        transition: opacity 420ms ease, visibility 420ms ease, transform 420ms ease;
      }

      .login-overlay.is-hidden {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.03);
        pointer-events: none;
      }

      .login-panel {
        width: min(100%, 320px);
        padding: 26px;
        border-radius: 24px;
        background: rgba(6, 18, 22, 0.58);
        border: 1px solid rgba(117, 247, 255, 0.18);
        box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.22);
      }

      .login-panel h2 {
        margin: 0 0 10px;
        font-size: 1.7rem;
      }

      .login-panel p {
        margin: 0 0 18px;
        color: rgba(255, 255, 255, 0.74);
        line-height: 1.5;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      .field label {
        font-size: 0.92rem;
        color: rgba(255, 255, 255, 0.8);
      }

      .field input {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 14px 15px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }

      .field input:focus {
        border-color: rgba(117, 247, 255, 0.56);
        box-shadow: 0 0 0 3px rgba(117, 247, 255, 0.14);
      }

      .login-button {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 15px;
        margin-top: 8px;
        background: linear-gradient(135deg, rgba(117, 247, 255, 0.95), rgba(78, 202, 255, 0.88));
        color: #07232c;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 26px rgba(87, 214, 255, 0.25);
      }

      .login-button:active {
        transform: scale(0.98);
      }

      .login-error {
        min-height: 20px;
        margin-top: 12px;
        color: var(--danger);
        font-size: 0.92rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      @media (max-width: 480px) {
        .app-shell {
          min-height: 680px;
        }

        .calculator-card,
        .login-overlay {
          border-radius: 24px;
        }

        .key {
          min-height: 68px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator-card" id="calculatorCard" aria-hidden="true">
        <div class="card-header">
          <div class="title-group">
            <p>Workshop Demo</p>
            <h1>Secure Calculator</h1>
          </div>
          <p class="auth-status" id="authStatus">Locked</p>
        </div>

        <section class="display" aria-live="polite">
          <p class="display-history" id="displayHistory">Awaiting authentication</p>
          <h2 class="display-main" id="displayMain">0</h2>
        </section>

        <section class="keypad" aria-label="Calculator keypad">
          <button class="key utility" data-action="clear">AC</button>
          <button class="key utility" data-action="delete">DEL</button>
          <button class="key operator" data-action="percent">%</button>
          <button class="key operator" data-operator="/">÷</button>

          <button class="key number" data-number="7">7</button>
          <button class="key number" data-number="8">8</button>
          <button class="key number" data-number="9">9</button>
          <button class="key operator" data-operator="*">×</button>

          <button class="key number" data-number="4">4</button>
          <button class="key number" data-number="5">5</button>
          <button class="key number" data-number="6">6</button>
          <button class="key operator" data-operator="-">−</button>

          <button class="key number" data-number="1">1</button>
          <button class="key number" data-number="2">2</button>
          <button class="key number" data-number="3">3</button>
          <button class="key operator" data-operator="+">+</button>

          <button class="key number" data-number="0">0</button>
          <button class="key number" data-number=".">.</button>
          <button class="key utility" data-action="sign">±</button>
          <button class="key equals" data-action="equals">=</button>
        </section>
      </section>

      <!--
        Authentication gate note:
        The login overlay sits on top of the calculator by default.
        Successful authentication toggles CSS classes so the overlay fades away
        and the calculator becomes interactive without rebuilding the DOM.
      -->
      <section class="login-overlay" id="loginOverlay">
        <form class="login-panel" id="loginForm" autocomplete="off">
          <h2>Authorized Access</h2>
          <p>Enter the workshop credentials to unlock the secure calculator interface.</p>

          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="admin" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••••••" required />
          </div>

          <input type="hidden" id="bpMeasureDate" name="BP_MEASURE_DATE_1" value="" />
          <span class="sr-only" id="bpMeasureLabel">BP_MEASURE_DATE_1</span>

          <button class="login-button" type="submit">Login</button>
          <p class="login-error" id="loginError" role="alert"></p>
        </form>
      </section>
    </main>

    <script>
      const VALID_CREDENTIALS = {
        username: 'admin',
        password: 'workshop2026',
      };

      const state = {
        currentInput: '0',
        previousInput: '',
        operator: '',
        waitingForNextValue: false,
        justCalculated: false,
        authenticated: false,
      };

      const loginForm = document.getElementById('loginForm');
      const loginOverlay = document.getElementById('loginOverlay');
      const calculatorCard = document.getElementById('calculatorCard');
      const loginError = document.getElementById('loginError');
      const bpMeasureDate = document.getElementById('bpMeasureDate');
      const authStatus = document.getElementById('authStatus');
      const displayHistory = document.getElementById('displayHistory');
      const displayMain = document.getElementById('displayMain');
      const keypad = document.querySelector('.keypad');

      function updateDisplay() {
        displayMain.textContent = state.currentInput;

        if (state.previousInput && state.operator) {
          displayHistory.textContent = `${state.previousInput} ${state.operator}`;
        } else if (state.authenticated) {
          displayHistory.textContent = state.justCalculated
            ? 'Result ready for the next calculation'
            : 'Secure session active';
        } else {
          displayHistory.textContent = 'Awaiting authentication';
        }
      }

      function resetCalculator() {
        state.currentInput = '0';
        state.previousInput = '';
        state.operator = '';
        state.waitingForNextValue = false;
        state.justCalculated = false;
        updateDisplay();
      }

      function inputNumber(value) {
        //
        // JavaScript state note:
        // currentInput and previousInput are stored as strings so the UI can preserve
        // partially typed values such as "0." without losing formatting. Flags such as
        // waitingForNextValue and justCalculated control when a fresh number should replace
        // the display versus append to the existing string.
        //
        if (state.justCalculated && !state.operator) {
          state.currentInput = value;
          state.justCalculated = false;
          updateDisplay();
          return;
        }

        if (state.waitingForNextValue) {
          state.currentInput = value;
          state.waitingForNextValue = false;
          state.justCalculated = false;
          updateDisplay();
          return;
        }

        if (value === '.' && state.currentInput.includes('.')) {
          return;
        }

        state.currentInput =
          state.currentInput === '0' && value !== '.' ? value : `${state.currentInput}${value}`;
        state.justCalculated = false;
        updateDisplay();
      }

      function handleOperator(nextOperator) {
        if (state.operator && !state.waitingForNextValue) {
          calculate();
        }

        state.previousInput = state.currentInput;
        state.operator = nextOperator;
        state.waitingForNextValue = true;
        state.justCalculated = false;
        updateDisplay();
      }

      function toggleSign() {
        if (state.currentInput === '0' || state.currentInput === 'Infinite Error') {
          return;
        }
        state.currentInput = state.currentInput.startsWith('-')
          ? state.currentInput.slice(1)
          : `-${state.currentInput}`;
        updateDisplay();
      }

      function deleteLastDigit() {
        if (state.waitingForNextValue || state.justCalculated) {
          return;
        }
        state.currentInput = state.currentInput.length > 1 ? state.currentInput.slice(0, -1) : '0';
        if (state.currentInput === '-' || state.currentInput === '') {
          state.currentInput = '0';
        }
        updateDisplay();
      }

      function applyPercentage() {
        if (state.currentInput === 'Infinite Error') {
          return;
        }
        state.currentInput = String(Number(state.currentInput) / 100);
        state.justCalculated = false;
        updateDisplay();
      }

      function secureCompute(leftValue, rightValue, operator) {
        if (operator === '/' && rightValue === 0) {
          return 'Infinite Error';
        }

        const operations = {
          '+': `${leftValue} + ${rightValue}`,
          '-': `${leftValue} - ${rightValue}`,
          '*': `${leftValue} * ${rightValue}`,
          '/': `${leftValue} / ${rightValue}`,
        };

        const expression = operations[operator];
        if (!expression) {
          return rightValue;
        }

        // Secure coding note:
        // This demo avoids eval() entirely. The operator choices are whitelisted above,
        // and only trusted numeric values are interpolated into the Function constructor.
        const compute = new Function(`return (${expression});`);
        const result = compute();
        return Number.isFinite(result) ? Number(result.toFixed(10)).toString() : 'Infinite Error';
      }

      function calculate() {
        if (!state.operator || state.waitingForNextValue) {
          return;
        }

        const leftValue = Number(state.previousInput);
        const rightValue = Number(state.currentInput);
        const result = secureCompute(leftValue, rightValue, state.operator);

        state.currentInput = result;
        state.previousInput = '';
        state.operator = '';
        state.waitingForNextValue = false;
        state.justCalculated = true;
        updateDisplay();
      }

      keypad.addEventListener('click', (event) => {
        const key = event.target.closest('button');
        if (!key || !state.authenticated) {
          return;
        }

        const { number, operator, action } = key.dataset;

        if (number !== undefined) {
          inputNumber(number);
          return;
        }

        if (operator) {
          handleOperator(operator);
          return;
        }

        switch (action) {
          case 'clear':
            resetCalculator();
            break;
          case 'delete':
            deleteLastDigit();
            break;
          case 'percent':
            applyPercentage();
            break;
          case 'sign':
            toggleSign();
            break;
          case 'equals':
            calculate();
            break;
          default:
            break;
        }
      });

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const formData = new FormData(loginForm);
        const username = String(formData.get('username') || '').trim();
        const password = String(formData.get('password') || '');

        if (
          username === VALID_CREDENTIALS.username &&
          password === VALID_CREDENTIALS.password
        ) {
          state.authenticated = true;
          loginError.textContent = '';
          authStatus.textContent = `Unlocked for ${username}`;
          bpMeasureDate.value = new Date().toISOString();
          console.log('BP_MEASURE_DATE_1', bpMeasureDate.value);
          loginOverlay.classList.add('is-hidden');
          calculatorCard.classList.add('is-unlocked');
          calculatorCard.setAttribute('aria-hidden', 'false');
          resetCalculator();
          return;
        }

        state.authenticated = false;
        loginError.textContent = 'Invalid credentials. Try admin / workshop2026.';
      });

      updateDisplay();
    </script>
  </body>
</html>
